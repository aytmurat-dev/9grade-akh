  <path class="sim" d="M236 164 V268 H272"/>
  <path class="sim" d="M236 112 H272"/>
  <path class="sim" d="M236 216 H272"/>

  <!-- 1. manifests -->
  <rect class="quti" x="272" y="36" width="250" height="48"/>
  <text class="nom" x="292" y="66">manifests</text>
  <text class="izoh" x="544" y="66">ILOVA PASPORTI</text>

  <!-- 2. kotlin+java -->
  <rect class="quti" x="272" y="88" width="250" height="48"/>
