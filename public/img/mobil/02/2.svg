    .izoh   { font: 400 19px 'IBM Plex Mono', Consolas, monospace; fill: #8b8578; }
    .quti   { fill: #e6e0d5; stroke: #cdc5b4; stroke-width: 2; }
    .sim    { stroke: #cdc5b4; stroke-width: 2; fill: none; }
  </style>

  <!-- Ildiz -->
  <rect x="20" y="128" width="180" height="72" fill="#f0ebe2" stroke="#b32b26" stroke-width="2.5"/>
  <text class="nom" x="110" y="171" text-anchor="middle" fill="#b32b26">app</text>

  <!-- Shoxlar -->
  <path class="sim" d="M200 164 H236 V60 H272"/>
