<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340" role="img" aria-label="app papkasining tort bolimi: manifests, kotlin+java, res va Gradle Scripts">
  <title>Loyiha daraxtining to'rt bo'limi</title>

  <!-- Dossier palitrasi (rules/11): qog'oz shaffof, siyoh, bitta qizil -->
  <style>
    .yorliq { font: 400 20px 'IBM Plex Mono', Consolas, monospace; fill: #8b8578; letter-spacing: .14em; }
